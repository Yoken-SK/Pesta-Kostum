<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoring Lomba Kostum - PetroChina</title>
    <!-- Tailwind CSS untuk UI yang responsif dan modern -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font Google Poppins agar tampilan lebih premium -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        select, input, button {
            min-height: 46px;
        }
        /* Custom scrollbar halus untuk rekap */
        .custom-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-12">

    <!-- Header Colorful ala PetroChina -->
    <header class="bg-gradient-to-r from-red-600 via-orange-500 to-amber-500 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Box Logo Putih agar Kontras & Rapi -->
                <div class="bg-white p-1 rounded-lg shadow-sm flex items-center justify-center w-10 h-10">
                    <img src="https://wikimedia.org" alt="PetroChina Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide leading-tight">Lomba Costume Casual</h1>
                    <p class="text-[10px] text-amber-100 font-medium">Team Building Assessment</p>
                </div>
            </div>
            <span class="bg-white/20 px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border border-white/20">HP Mode</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Info Juri Card -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-red-600"></div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nama Juri / Penilai</label>
            <div class="relative">
                <input type="text" id="namaJuri" placeholder="Ketik nama Anda di sini..." class="w-full border border-slate-200 rounded-xl px-3 py-2 bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:outline-none text-sm transition-all duration-200">
            </div>
        </section>

        <!-- Form Penilaian Card -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-5">
            <div class="flex items-center space-x-2 border-b border-slate-100 pb-3">
                <div class="w-2 h-2 rounded-full bg-amber-500"></div>
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Form Input Nilai</h2>
            </div>
            
            <!-- Pilih Peserta -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Peserta / Tim</label>
                <select id="pilihPeserta" class="w-full border border-slate-200 rounded-xl px-3 py-2 bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm font-medium transition-all duration-200">
                    <option value="">-- Ketuk untuk memilih nama --</option>
                    <option value="Peserta 01 - Budi">Peserta 01 - Budi</option>
                    <option value="Peserta 02 - Sinta">Peserta 02 - Sinta</option>
                    <option value="Peserta 03 - Andi">Peserta 03 - Andi</option>
                    <option value="Peserta 04 - Rini">Peserta 04 - Rini</option>
                    <option value="Peserta 05 - Doni">Peserta 05 - Doni</option>
                </select>
            </div>

            <!-- Panduan Skala Nilai -->
            <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-3 rounded-xl border border-orange-100/70 text-[11px] text-orange-900 flex justify-between font-medium">
                <span class="flex items-center"><span class="w-4 h-4 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-[9px] mr-1 font-bold">1</span> Cukup</span>
                <span class="flex items-center"><span class="w-4 h-4 rounded-full bg-amber-500 text-white flex items-center justify-center text-[9px] mr-1 font-bold">2</span> Baik</span>
                <span class="flex items-center"><span class="w-4 h-4 rounded-full bg-red-600 text-white flex items-center justify-center text-[9px] mr-1 font-bold">3</span> Sangat Baik</span>
            </div>

            <!-- Kriteria Penilaian -->
            <div class="space-y-4">
                <!-- Kriteria 1 -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="block text-xs font-semibold text-slate-700 mb-2">1. Kesesuaian Tema (Casual/Sopan/Rapi)</label>
                    <select id="kriteria1" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                        <option value="1">1 - Cukup</option>
                        <option value="2" selected>2 - Baik</option>
                        <option value="3">3 - Sangat Baik</option>
                    </select>
                </div>

                <!-- Kriteria 2 -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="block text-xs font-semibold text-slate-700 mb-2">2. Kreativitas & Orisinalitas</label>
                    <select id="kriteria2" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                        <option value="1">1 - Cukup</option>
                        <option value="2" selected>2 - Baik</option>
                        <option value="3">3 - Sangat Baik</option>
                    </select>
                </div>

                <!-- Kriteria 3 -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="block text-xs font-semibold text-slate-700 mb-2">3. Pembawaan & Percaya Diri</label>
                    <select id="kriteria3" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                        <option value="1">1 - Cukup</option>
                        <option value="2" selected>2 - Baik</option>
                        <option value="3">3 - Sangat Baik</option>
                    </select>
                </div>

                <!-- Kriteria 4 -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <label class="block text-xs font-semibold text-slate-700 mb-2">4. Detail & Estetika Kerapian</label>
                    <select id="kriteria4" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-sm font-bold text-slate-700 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                        <option value="1">1 - Cukup</option>
                        <option value="2" selected>2 - Baik</option>
                        <option value="3">3 - Sangat Baik</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Simpan -->
            <button onclick="simpanNilai()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-700 hover:to-orange-600 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md shadow-orange-500/20 tracking-wide text-sm">
                Simpan & Update Rekap
            </button>
        </section>

        <!-- Hasil Rekap Sementara Card -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-red-600"></div>
                    <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Papan Nilai Juri</h2>
                </div>
                <button onclick="clearData()" class="text-xs text-red-500 hover:text-red-700 font-semibold transition">Reset Semua</button>
            </div>
            
            <div id="wrapperTabel" class="overflow-x-auto custom-scroll hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-slate-400 border-b border-slate-100 uppercase tracking-wider font-bold">
                            <th class="pb-2">Nama Peserta</th>
                            <th class="pb-2 text-center">Skor (1-4)</th>
                            <th class="pb-2 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTabel" class="divide-y divide-slate-50 text-sm">
                        <!-- Data Nilai via Javascript -->
                    </tbody>
                </table>
            </div>
            <p id="pesanKosong" class="text-xs text-slate-400 text-center py-6 font-medium">Belum ada data nilai masuk dari Anda.</p>
        </section>

    </main>

    <script>
