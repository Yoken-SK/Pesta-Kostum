<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scoring Lomba Kostum - PetroChina</title>
    <style>
        /* Tema Gelap Hijau & Reset Dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b130f; 
            color: #e2e8f0; 
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #12221a; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #1f3a2b;
        }
        
        h1 { 
            font-size: 1.4rem; 
            color: #10b981; 
            text-align: center; 
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #a7f3d0;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        h2 { font-size: 1.2rem; color: #34d399; margin: 20px 0 10px 0; border-bottom: 1px solid #1f3a2b; padding-bottom: 5px; }
        
        /* Form & Input Mobile-Friendly */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; color: #cbd5e1; }
        
        /* Optimalisasi input untuk iOS & Android */
        input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; /* Mencegah auto-zoom otomatis di Safari iPhone */
            background-color: #1a3024; 
            border: 1px solid #2d523d; 
            border-radius: 8px; 
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none; /* Reset gaya bawaan iOS */
        }
        input:focus, select:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        
        /* Box Kriteria */
        .criteria-box { 
            background: #0f2d1e; 
            padding: 12px; 
            border-left: 4px solid #10b981; 
            margin-bottom: 20px; 
            font-size: 0.85rem; 
            border-radius: 0 8px 8px 0;
            line-height: 1.4;
        }
        .criteria-box strong { color: #34d399; }
        
        /* Tombol Ukuran Besar untuk Sentuhan Jari */
        button { 
            display: block;
            width: 100%; 
            background-color: #10b981; 
            color: #0b130f; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        button:active { background-color: #059669; }
        
        /* Pembungkus Tabel agar bisa di-scroll secara horizontal di HP */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #1f3a2b;
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 450px; font-size: 0.9rem; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #1f3a2b; }
        th { background-color: #162e22; color: #34d399; font-weight: 600; }
        tr:nth-child(even) { background-color: #15271e; }
        .rank { font-weight: bold; color: #f59e0b; text-align: center; }
        td strong { color: #f8fafc; }
        
        /* Custom Dropdown Arrow untuk iOS */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "▼"; font-size: 10px; color: #a7f3d0;
            position: absolute; right: 15px; top: 16px; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Scoring Juri Lomba Kostum</h1>
    <div class="subtitle">PetroChina Offline Mode</div>
    
    <!-- Input Juri -->
    <div class="form-group">
        <label for="namaJuri">Nama Juri</label>
        <input type="text" id="namaJuri" placeholder="Ketik nama Anda...">
    </div>

    <div class="criteria-box">
        <strong>Kriteria Penilaian:</strong><br>
        6-7 (60-79): Cukup | 8 (80-89): Baik | 9 (90-100): Istimewa
    </div>

    <!-- Input Nilai Peserta -->
    <h2>Input Nilai Peserta</h2>
    <div class="form-group">
        <label for="pilihPeserta">Pilih Peserta Lomba</label>
        <div class="select-wrapper">
            <select id="pilihPeserta"></select>
        </div>
    </div>
    
    <div class="form-group">
        <label for="nilaiKostum">Nilai Skor (60 - 100)</label>
        <input type="number" id="nilaiKostum" inputmode="numeric" min="60" max="100" placeholder="Masukkan skor...">
    </div>

    <button onclick="simpanNilai()">Simpan & Update Skor</button>

    <!-- Leaderboard / Skor Sementara -->
    <h2>Papan Skor Sementara (Top 50)</h2>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px; text-align: center;">Rank</th>
                    <th style="width: 60px;">No</th>
                    <th>Nama Peserta</th>
                    <th style="width: 70px;">Skor</th>
                    <th>Juri</th>
                </tr>
            </thead>
            <tbody id="tabelSkor">
                <!-- Data otomatis terisi -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Database 50 Peserta
    const dataPeserta = [
        "PUTU BUDAYASA", "MUHAMMAD ASRI", "PRIMAYUDI", "TANDI MATONGAN", "KUBROHADI",
        "SASONO WIDODO", "NURAYAH", "TOTOK WIDI NUGROHO", "BUDIYONO", "SABAR LUMBAN TORUAN",
        "M. SAPRI", "WAGISO", "SOLIHIN", "SALMON BATUBARA", "YUZARMEN",
        "MULYONO HERLAMBANG", "ALBERTUS SUPRIWANTA", "LASNO", "ENDANG SUSILAWATI", "APRIDA BUSTAMI",
        "K. JUAH BRAHMANA", "ABE GORATO PASARIBU", "R.M. REYNER IQBAL KHAMESWARA", "LILIEK RACHMANU SYAFEI", "HARRY HANDOYO",
        "ARIANSYAH LUKMAN", "HENDRA", "KAMARUDDIN", "BASUKI", "DR. WILLIAM ADITYA",
        "JOHNY CAPRIANTO", "ADEWIRA HANDAYANI", "YODI (GOVREL)", "YUSRIADI TYAJAYA", "ARI SETIAWAN PRAKOSO",
        "NASIRWAN HAMONANGAN", "TRI OMPU ARISIKAM", "SUGIYANTO", "IQBAL MAULANA ARISA EFFENDI", "EKAWATI MASRI",
        "DANANG SANTOSO", "FARAH FADILAH", "GAJIANTO PANGARSO HK", "AGUNG BRATANATA", "FERNAN K DJOHAN",
        "HERI SUPRIYONO", "AMINUDIN (CAPTAIN)", "BAKRI", "MAHMUDI", "DINANTA MAULANA"
    ];

    let skorPeserta = dataPeserta.map((nama, index) => ({
        noUrut: index + 1,
        nama: nama,
        skor: 0,
        juri: "-"
    }));

    function init() {
        const select = document.getElementById("pilihPeserta");
        skorPeserta.forEach(p => {
            let opt = document.createElement("option");
            opt.value = p.noUrut;
            opt.textContent = `${p.noUrut}. ${p.nama}`;
            select.appendChild(opt);
        });
        tampilkanLeaderboard();
    }

    function simpanNilai() {
        const juri = document.getElementById("namaJuri").value.trim();
        const idPeserta = parseInt(document.getElementById("pilihPeserta").value);
        const nilai = parseInt(document.getElementById("nilaiKostum").value);

        if (!juri) {
            alert("Harap masukkan nama juri terlebih dahulu!");
            return;
        }
        if (isNaN(nilai) || nilai < 60 || nilai > 100) {
            alert("Harap masukkan skor valid antara 60 hingga 100!");
            return;
        }

        let peserta = skorPeserta.find(p => p.noUrut === idPeserta);
        if (peserta) {
            peserta.skor = nilai;
            peserta.juri = juri;
        }

        document.getElementById("nilaiKostum").value = "";
        tampilkanLeaderboard();
        
        // Pindahkan dropdown otomatis ke peserta berikutnya agar juri lebih cepat menginput
        const select = document.getElementById("pilihPeserta");
        if (select.selectedIndex < select.options.length - 1) {
            select.selectedIndex += 1;
        }
    }

    function tampilkanLeaderboard() {
        const tbody = document.getElementById("tabelSkor");
        tbody.innerHTML = "";

        // Urutkan dari skor tertinggi
        let diurutkan = [...skorPeserta].sort((a, b) => b.skor - a.skor);

        diurutkan.forEach((p, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="rank">${index + 1}</td>
                <td>${p.noUrut}</td>
                <td>${p.nama}</td>
                <td><strong>${p.skor > 0 ? p.skor : '-'}</strong></td>
                <td>${p.juri}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = init;
</script>

</body>
</html>
